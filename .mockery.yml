all: false
force-file-write: true
formatter: goimports
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: mocks
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/MatheusGardin/VReps/internal/app/interfaces:
    config:
      all: true
      dir: './internal/mocks'
      filename: service_mocks.go
  github.com/MatheusGardin/VReps/internal/domain/common/interfaces:
    config:
      all: true
      dir: './internal/mocks'
      filename: common_domain_mocks.go
  github.com/MatheusGardin/VReps/internal/domain/user/interfaces:
    config:
      all: true
      dir: './internal/mocks'
      filename: user_domain_mocks.go
  github.com/MatheusGardin/VReps/internal/domain/task/interfaces:
    config:
      all: true
      dir: './internal/mocks'
      filename: task_domain_mocks.go
